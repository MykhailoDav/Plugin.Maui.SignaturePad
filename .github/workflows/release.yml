name: Release

# Publishes the package to nuget.org when a maintainer pushes a version tag, such as v0.1.0-preview.1, for a commit on
# main. Nothing else starts it. The tag must match <Version> in the library's project.
#
# Publishing uses NuGet trusted publishing, so no API key is stored: nuget.org trusts this workflow file of this
# repository and exchanges the job's OIDC token for an API key that is valid for one hour. Before the first release:
# - on nuget.org, add a trusted publishing policy for this repository, the workflow file release.yml and the
#   environment release;
# - in the repository settings, add the environment release with the secret NUGET_USER, the nuget.org profile name
#   (not the email address). Required reviewers on the environment make every release wait for an approval.
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The workload set for the SDK in global.json.
env:
  DOTNET_WORKLOAD_VERSION: 10.0.400.1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish to nuget.org
    # Only Windows builds all five targets of the package.
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read # to check out the code
      id-token: write # for the OIDC token of NuGet trusted publishing
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # The whole history, to check that the tagged commit is on main.
        fetch-depth: 0
    - name: Check the tag
      shell: bash
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::The tag $GITHUB_REF_NAME is not on main."
          exit 1
        fi
        version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Plugin.Maui.SignaturePad/Plugin.Maui.SignaturePad.csproj)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::The tag $GITHUB_REF_NAME does not match the version in the project, $version."
          exit 1
        fi
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Install .NET MAUI
      run: dotnet workload install maui --version $env:DOTNET_WORKLOAD_VERSION

    - name: Build the library
      run: dotnet build src/Plugin.Maui.SignaturePad -c Release
    - name: Run the unit tests
      run: >-
        dotnet test --project tests/Plugin.Maui.SignaturePad.Tests
        --coverlet --coverlet-threshold 100 --coverlet-threshold-type line,branch --coverlet-threshold-stat total
    - name: Pack
      run: dotnet pack src/Plugin.Maui.SignaturePad -c Release --no-build -o artifacts/package
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package
        path: artifacts/package

    - name: Log in to nuget.org
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to nuget.org
      # The symbol package next to the package is pushed with it. A version that is already there is skipped, so the
      # job can be run again.
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push artifacts/package/*.nupkg --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
