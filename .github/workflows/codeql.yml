name: CodeQL

# Scans the C# code and the workflows for security problems, for every pull request into main, after every merge into
# main, weekly and on demand. Both languages are analysed from source, without a build, so the scan needs no MAUI
# workloads and covers the code of every platform.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
  - cron: '27 4 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels the scan of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
      security-events: write # to upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [ csharp, actions ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended
    - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        category: /language:${{ matrix.language }}
